name: Deploy React to WordPress

on:
  push:
    branches: [ react-frontend ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies and Build
      run: |
        npm install
        npm run build

    - name: Copy files to WordPress server via SSK
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASS }}
        port: 22
        script: |
          echo "Connected to server!"
        source: "build/*"
        target: "/var/www/html/wp-content/react"
